# Deltas on top of detekt's default config (buildUponDefaultConfig = true).
# Keep this file minimal — every entry needs a reason.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  # Compose UI trees are declarative layout, not imperative logic — length
  # and parameter-count heuristics measure the wrong thing there.
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Same convention as the @Suppress in Color.kt: palettes are literals.
    ignoreAnnotated: ['Composable']
